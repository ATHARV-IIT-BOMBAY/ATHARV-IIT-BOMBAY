<svg width="1400" height="380" viewBox="0 0 1400 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Atharv — quantitative finance, machine learning, and systems</title>
  <desc id="desc">A monochrome technical profile header with a red signal line and a dot matrix.</desc>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#A3A3A3" fill-opacity="0.22"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3B30" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#FF3B30" stop-opacity="0.95"/>
      <stop offset="0.8" stop-color="#FF3B30" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FF3B30" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="380" rx="18" fill="#0B0B0B"/>
  <rect width="1400" height="380" rx="18" fill="url(#dots)"/>
  <path d="M0 78H1400M0 300H1400" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <path d="M72 0V380M1328 0V380" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <circle cx="72" cy="76" r="7" fill="#FF3B30"/>
  <circle cx="72" cy="76" r="18" stroke="#FF3B30" stroke-opacity="0.25"/>

  <text x="108" y="84" fill="#F5F5F5" font-family="Inter, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="4">ATHARV / IIT BOMBAY</text>
  <text x="1328" y="84" text-anchor="end" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="3">SIGNAL 001</text>

  <text x="72" y="206" fill="#F5F5F5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="700" letter-spacing="-2">QUANT / ML / SYSTEMS</text>
  <text x="76" y="250" fill="#A3A3A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">risk · intelligence · performance · useful interfaces</text>

  <path d="M72 302H286L322 282L351 322L386 302H630L664 287L699 317L735 302H1044L1078 276L1111 326L1148 302H1328" stroke="url(#fade)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="1078" cy="276" r="5" fill="#FF3B30" filter="url(#glow)"/>

  <text x="72" y="346" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2">LOW LATENCY</text>
  <text x="630" y="346" text-anchor="middle" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2">MODEL RISK</text>
  <text x="1328" y="346" text-anchor="end" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2">HUMAN USEFULNESS</text>
</svg>
